@font-face{font-family:"Clash Display";src:url(assets/clash-display-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Clash Display";src:url(assets/clash-display-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Link in bio Cresqoo su Trama: una colonna da telefono, foto in alto, tre azioni. Tema unico scuro di brand. */
:root{--olive:#3f463a;--olive-dark:#373d33;--ink:#232720;--white:#fff;--soft:rgba(255,255,255,.7);--line:rgba(255,255,255,.18);
  --display:"Clash Display","Helvetica Neue",Arial,sans-serif;--text:"Inter","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--olive-dark);color:var(--white);font-family:var(--text);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:440px;margin:0 auto;padding-block:20px 28px;display:grid;gap:14px}
.cover{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--ink)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,39,32,0) 35%,rgba(35,39,32,.9) 100%)}
.cover .id{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;display:flex;align-items:end;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em}
.tag{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.intro{font-size:15px;line-height:1.5;color:var(--soft);padding-inline:2px}
.links{display:grid;gap:10px;margin-top:4px}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;border-radius:10px;padding:18px 18px;font-family:var(--display);font-weight:500;font-size:18px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--white);transition:background .2s}
.link small{display:block;font-family:var(--text);font-weight:400;font-size:13px;color:var(--soft);margin-top:3px}
.link:hover{background:rgba(255,255,255,.08)}
.link.primary{background:var(--white);color:var(--ink);border-color:var(--white)}
.link.primary small{color:rgba(35,39,32,.65)}
.link svg{flex:none;width:18px;height:18px}
.link:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--soft)}
.foot .by{color:var(--soft);text-decoration:none;padding:8px 0;transition:color .2s}.foot .by u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}.foot .by:hover{color:var(--white)}.foot .by:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.foot b{font-family:var(--display);font-weight:700;font-size:22px;color:var(--white);line-height:1}
.note{font-size:12px;color:var(--soft);text-align:center;border:1px dashed var(--line);border-radius:8px;padding:8px}
</style>

  </div>

  </nav>
